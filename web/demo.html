<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precedent - the race</title>
<style>
  :root{--bg:#0B0C0E;--pan:#121519;--brd:#242A31;--txt:#E7E4DF;--mut:#79818B;--dim:#4A5058;
        --amb:#F5A524;--ver:#E8442C;--grn:#6FCF97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:18px;
         padding:18px 26px 16px;border-bottom:1px solid var(--brd);flex-wrap:wrap}
  .wm{font:600 22px/1 Georgia,serif;letter-spacing:-.01em}
  .wm i{color:var(--ver);font-style:normal}
  .task{flex:1;text-align:center;font-size:12.5px;color:var(--mut);min-width:220px}
  .task b{color:var(--txt);font-weight:500}
  .clk{font-family:ui-monospace,Consolas,monospace;font-size:24px;color:var(--amb);
       font-variant-numeric:tabular-nums}
  .panes{display:grid;grid-template-columns:1fr 1fr}
  .p{padding:16px 22px 20px;min-width:0}
  .p+.p{border-left:1px solid var(--brd)}
  .ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .arm{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
  .meta{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;color:var(--dim)}
  iframe{width:100%;height:300px;border:1px solid var(--brd);border-radius:7px;background:#0E1014}
  .tr{font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.85;
      color:var(--dim);margin-top:11px;min-height:74px}
  .tr b{color:#9AA3AD;font-weight:400}
  .tr .h{color:var(--ver)}
  .verd{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:6px 13px;
        border-radius:999px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
        background:#191D23;color:var(--dim)}
  .verd.f{background:#2A1210;color:#F0837F}
  .verd.p{background:#0F2619;color:var(--grn)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .halt{margin-top:11px;border:1px solid var(--ver);border-left-width:4px;border-radius:3px;
        background:#19100F;padding:12px 14px 13px}
  .halt .tag{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.2em;
             color:var(--ver);margin-bottom:8px}
  .halt .say{font:16px/1.35 Georgia,serif;margin-bottom:9px}
  .halt .rule{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#B9AFA6;
              background:#241814;border-radius:2px;padding:6px 9px;margin-bottom:9px}
  .rc{display:flex;gap:18px;flex-wrap:wrap;font-family:ui-monospace,Consolas,monospace;
      font-size:8.5px;letter-spacing:.1em;color:var(--dim)}
  .rc b{display:block;font-size:11px;color:#9AA3AD;margin-top:3px;letter-spacing:.02em}
  .rc .g{color:var(--grn)}
  footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
         padding:12px 26px;border-top:1px solid var(--brd);background:#0E1013;
         font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.14em;color:var(--dim)}
  footer b{color:var(--amb);font-weight:400}
  button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
         background:transparent;color:var(--txt);border:1px solid var(--brd);border-radius:4px;
         padding:7px 15px;cursor:pointer;margin-left:8px}
  button:hover{border-color:var(--amb);color:var(--amb)}
  @media (max-width:760px){.panes{grid-template-columns:1fr}
    .p+.p{border-left:0;border-top:1px solid var(--brd)}}
</style>

<header>
  <div class="wm">Precedent<i>.</i></div>
  <div class="task">One task &middot; one model &middot; one seed &middot; one clock &mdash; <b id="task"></b></div>
  <div class="clk" id="clk">00:00</div>
</header>

<div class="panes">
  <div class="p">
    <div class="ph"><div class="arm">Without memory</div><div class="meta">arm A &middot; ledger off</div></div>
    <iframe id="fa" scrolling="no" src="http://127.0.0.1:8901/"></iframe>
    <div class="tr" id="ta"></div>
    <div class="verd" id="va"><span class="dot"></span>running</div>
  </div>
  <div class="p">
    <div class="ph"><div class="arm">With precedent</div><div class="meta">arm C &middot; ledger on</div></div>
    <iframe id="fc" scrolling="no" src="http://127.0.0.1:8902/"></iframe>
    <div class="tr" id="tc"></div>
    <div id="card"></div>
    <div class="verd" id="vc"><span class="dot"></span>running</div>
  </div>
</div>

<footer>
  <span id="ledger">LEDGER</span>
  <span><button onclick="play()">Play</button><button onclick="step()">Step</button><button onclick="reset()">Reset</button></span>
</footer>

<script>
var t0 = Date.now(), playing = null;

setInterval(function(){
  var s = Math.floor((Date.now() - t0) / 1000);
  document.getElementById("clk").textContent =
    String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}, 200);

function reloadApps(){
  ["fa", "fc"].forEach(function(id){
    var f = document.getElementById(id);
    f.src = f.src.split("?")[0] + "?t=" + Date.now();
  });
}

function trace(el, lines){
  el.innerHTML = lines.map(function(l){
    return l.indexOf("HALTED") > -1
      ? "<div><b>" + l.replace("HALTED", "") + "</b><span class=\"h\">HALTED</span></div>"
      : "<div><b>" + l + "</b></div>";
  }).join("");
}

function mark(id, ok){
  var el = document.getElementById(id);
  el.className = "verd " + (ok ? "p" : "f");
  el.innerHTML = "<span class=\"dot\"></span>" + (ok ? "app still standing" : "app is down");
}

function render(s){
  document.getElementById("task").textContent = s.task;
  trace(document.getElementById("ta"), s.trace.A);
  trace(document.getElementById("tc"), s.trace.C);
  var c = s.counts || {};
  document.getElementById("ledger").innerHTML =
    "LEDGER &middot; " + (c.cases || 0) + " CASES &middot; <b>" + (c.binding || 0) +
    " BINDING</b> &middot; " + (c.persuasive || 0) + " ADVISORY &middot; " +
    (c.overruled || 0) + " OVERRULED";

  if (s.blocked){
    var b = s.blocked, e = b.empanel || {};
    document.getElementById("card").innerHTML =
      "<div class=\"halt\"><div class=\"tag\">HALT &middot; BINDING PRECEDENT No " + b.n +
      " &middot; " + b.when + "</div><div class=\"say\">" + b.says + "</div>" +
      "<div class=\"rule\">" + b.rule + "</div><div class=\"rc\">" +
      "<div>EMPANELLED<b class=\"g\">" + (e.fire || "-") + " fire &middot; " + (e["false"] || "-") + " false</b></div>" +
      "<div>CITED<b>" + b.cited + " times</b></div>" +
      "<div>OVERRULED<b>never</b></div></div></div>";
  }

  if (s.step >= s.total){
    var v = s.verdict || {};
    mark("va", !!v.A);
    mark("vc", !!v.C);
    if (playing){ clearInterval(playing); playing = null; }
  }
  reloadApps();
}

function step(){ return fetch("/step").then(function(r){ return r.json(); }).then(render); }

function reset(){
  return fetch("/reset").then(function(r){ return r.json(); }).then(function(s){
    t0 = Date.now();
    ["va", "vc"].forEach(function(i){
      var e = document.getElementById(i);
      e.className = "verd";
      e.innerHTML = "<span class=\"dot\"></span>running";
    });
    document.getElementById("card").innerHTML = "";
    render(s);
  });
}

function play(){ if (playing) return; playing = setInterval(step, 2400); step(); }

fetch("/state").then(function(r){ return r.json(); }).then(render);
</script>
