<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precedent — the desk</title>
<link rel="stylesheet" href="office.css">
<style>
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
         padding:14px 22px;border-bottom:3px solid var(--line);flex-wrap:wrap}
  .wm{font:400 19px/1 Georgia,serif}
  .wm b{color:var(--stamp);font-weight:400}
  .status{display:flex;align-items:center;gap:9px;color:var(--dim)}
  .status .lamp{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .status.live .lamp{background:var(--phos)}
  .status.halt .lamp{background:var(--stamp)}

  main{padding:20px 22px 40px;max-width:1180px;margin:0 auto}

  /* the room */
  #stage{width:1200px;height:720px}
  /* A floor, so the furniture stands on something instead of hanging in the
     dark. The skirting line is where the wall stops. */
  #floor{position:absolute;left:0;right:0;bottom:0;height:48px;
         background:#1C1620;border-top:4px solid var(--line)}
  @media (max-width:1240px){ #stage{transform-origin:top left} }

  /* the halt card slides out from under the stamp */
  /* Clear of the cabinet above and the plant across the room, so the one
     thing carrying weight on this page is never partly hidden. */
  #halt{position:absolute;left:616px;top:508px;width:404px;display:none;z-index:5}
  #halt.on{display:block;animation:slide .28s steps(4) both}
  @keyframes slide{from{transform:translate(-22px,10px);opacity:0}to{transform:none;opacity:1}}
  #halt .no{font-family:ui-monospace,Consolas,monospace;font-size:10px;
            letter-spacing:.18em;color:var(--stamp)}
  #halt .says{font:400 17px/1.35 Georgia,serif;margin:6px 0 8px}
  #halt .why,#halt .next{font-family:ui-monospace,Consolas,monospace;font-size:11px}
  #halt .why{color:#6a5f52}
  #halt .next{color:var(--ink);background:var(--amber);display:inline-block;
              padding:3px 7px;margin-top:8px}

  /* what landed on the desk */
  /* Sprites are appended after this node, so without a z-index the paper stack
     paints over the filenames and clips them. */
  #incoming{position:absolute;left:620px;top:360px;width:260px;z-index:6;
            font-family:ui-monospace,Consolas,monospace;font-size:11px;
            color:var(--paper-dim);display:none;text-shadow:0 1px 0 var(--ink)}
  #incoming.on{display:block}
  #incoming b{color:var(--paper);font-weight:400;display:block}

  /* the panel of every rule that looked */
  .ledger{margin-top:22px}
  .ledger h2{font:400 17px/1.3 Georgia,serif;margin:0 0 3px}
  .ledger .hint{color:var(--dim);font-size:12px;margin:0 0 14px}
  .seat{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;
        border-bottom:1px solid var(--line);font-size:12.5px}
  .seat:last-child{border-bottom:none}
  .seat i{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px;background:#243040}
  .seat .who{flex:1;min-width:0}
  .seat .why{font-family:ui-monospace,Consolas,monospace;font-size:11px;
             color:var(--dim);margin-top:3px}
  .seat .dom{font-family:ui-monospace,Consolas,monospace;font-size:9px;
             letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .v-halt i{background:var(--stamp)}  .v-halt .who{color:var(--stamp)}
  .v-note i{background:var(--amber)}  .v-note .who{color:var(--amber)}
  .v-skip i{background:var(--dim)}
  .v-clear .who{color:var(--dim)}

  .empty{border:3px dashed var(--line);border-radius:4px;padding:30px 24px;
         text-align:center;max-width:560px;margin:14px auto}
  .empty .big{font:400 18px/1.4 Georgia,serif;margin-bottom:9px}
  .empty p{color:var(--dim);font-size:12.5px;margin:0 auto;max-width:52ch}
  .empty code{background:var(--panel);padding:2px 6px;border:1px solid var(--line)}
</style>

<header>
  <div class="wm">Precedent<b>.</b></div>
  <div class="status" id="status"><span class="lamp"></span><span id="statustext">no service</span></div>
</header>

<main>
  <div class="stage" id="stage">
    <div id="floor"></div>
    <div class="card" id="halt">
      <div class="no" id="haltno"></div>
      <div class="says" id="haltsays"></div>
      <div class="why" id="haltwhy"></div>
      <div class="next" id="haltnext"></div>
    </div>
    <div id="incoming"></div>
  </div>

  <div class="ledger">
    <h2 id="ledgerhead">Nothing has been judged yet.</h2>
    <p class="hint" id="ledgerhint">Every rule that looks at a change is listed here, including
      the ones that look and say nothing.</p>
    <div class="plate" id="seats" style="padding:6px 4px"></div>
  </div>
</main>

<script>
const SERVICE = new URLSearchParams(location.search).get("service") || "http://127.0.0.1:4000";
const PX = 4;                       // integer scale for every sprite

// ---- the room ----------------------------------------------------------
// x, y are logical pixels inside the room; JS multiplies by PX so the scene and
// the sprite sheet can never disagree about scale.
// The desk top surface sits at y=126. Anything ON the desk has its BOTTOM at
// 127, or it looks sunk into the wood.
const ROOM = { w: 300, h: 180, deskTop: 126 };
const LAYOUT = [
  { piece: "chart",   x: 14,  y: 18,  go: "#ablation", title: "the evidence" },
  { piece: "cabinet", x: 232, y: 26,  go: "#docket",   title: "the docket" },
  { piece: "desk",    x: 78,  y: 126 },
  { piece: "lamp",    x: 86,  y: 83 },                       // 83 + 44 = 127
  { piece: "papers",  x: 176, y: 107, id: "sprite-papers" }, // 107 + 20 = 127
  { piece: "mug",     x: 198, y: 111 },                      // 111 + 16 = 127
  { piece: "plant",   x: 20,  y: 136 },   // far corner: it is decoration and
                                        // must not crowd the verdict
];

let OFFICE = null, CLERK = null, clerkTimer = null;

function place(sheet, meta, spec, stage){
  const b = meta.pieces[spec.piece];
  const el = document.createElement("div");
  el.className = "sprite" + (spec.go ? " clickable" : "");
  if (spec.id) el.id = spec.id;
  el.style.cssText = `left:${spec.x * PX}px; top:${spec.y * PX}px;
    width:${b.w * PX}px; height:${b.h * PX}px;
    background-image:url("${sheet}");
    background-size:${meta.sheet.w * PX}px ${meta.sheet.h * PX}px;
    background-position:-${b.x * PX}px -${b.y * PX}px;`;
  if (spec.go){
    el.title = spec.title || "";
    el.onclick = () => location.href = "board.html" + spec.go;
  }
  stage.appendChild(el);
  return el;
}

// ---- the clerk ---------------------------------------------------------
function mountClerk(meta, stage){
  const el = document.createElement("div");
  el.className = "sprite";
  el.id = "clerk";
  // Feet land exactly on the desk top, so the clerk stands behind it.
  el.style.cssText = `left:${118 * PX}px; top:${(ROOM.deskTop - meta.frame.h) * PX}px;
    width:${meta.frame.w * PX}px; height:${meta.frame.h * PX}px;
    background-image:url("sprites/clerk.png");
    background-size:auto ${meta.frame.h * PX}px;`;
  stage.appendChild(el);
  return el;
}

function clerkState(state){
  if (!CLERK || !CLERK.meta.states[state]) return;
  const el = document.getElementById("clerk");
  const frames = CLERK.meta.states[state];
  const ms = CLERK.meta.timing[state];
  const loop = CLERK.meta.loop[state];
  let i = 0;
  const show = () => el.style.backgroundPosition =
    `-${frames[i] * CLERK.meta.frame.w * PX}px 0`;
  clearInterval(clerkTimer);
  show();
  if (frames.length < 2) return;
  clerkTimer = setInterval(() => {
    i++;
    if (i >= frames.length){
      if (!loop){ clearInterval(clerkTimer); i = frames.length - 1; show(); return; }
      i = 0;
    }
    show();
  }, ms);
}

// ---- the stream --------------------------------------------------------
let stream = null, sawAnything = false;

function setStatus(kind, text){
  const s = document.getElementById("status");
  s.className = "status" + (kind ? " " + kind : "");
  document.getElementById("statustext").textContent = text;
}

function connect(){
  if (stream) return;
  try { stream = new EventSource(SERVICE + "/v1/events"); } catch { return offline(); }

  stream.onopen = () => { setStatus("live", "watching"); clerkState("watching"); };
  stream.onerror = () => {
    stream.close(); stream = null; offline(); setTimeout(connect, 4000);
  };
  stream.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.kind === "watch.start"){
      setStatus("live", "watching " + (ev.repo || "").split(/[\\/]/).pop());
      clerkState("watching");
    }
    if (ev.kind === "sitting") sitting(ev);
    if (ev.kind === "recovered"){
      document.getElementById("halt").classList.remove("on");
      clerkState("cleared");
      setTimeout(() => clerkState("filing"), 700);
      setStatus("live", "cleared");
    }
  };
}

function offline(){
  setStatus("", "no service on " + SERVICE);
  clerkState("dormant");
  if (!sawAnything){
    document.getElementById("seats").innerHTML = `<div class="empty">
      <div class="big">Nobody is at the desk.</div>
      <p>Run <code>python -m precedent watch</code> in a repository, then edit a file with
      any agent or any editor. Every rule's decision appears here as it happens.</p></div>`;
  }
}

function sitting(ev){
  sawAnything = true;
  const seats = ev.seats || [];
  const halted = seats.filter(s => s.verdict === "halt");
  const skipped = seats.some(s => s.verdict === "skip");

  // what landed on the desk
  const inc = document.getElementById("incoming");
  if (ev.touched && ev.touched.length){
    inc.classList.add("on");
    inc.innerHTML = ev.touched.slice(0, 4).map(f => `<b>${f}</b>`).join("")
      + (ev.touched.length > 4 ? `+${ev.touched.length - 4} more` : "");
    document.getElementById("sprite-papers").style.display = "";
  } else {
    inc.classList.remove("on");
    document.getElementById("sprite-papers").style.display = "none";
  }

  if (halted.length){
    const v = halted[0];
    document.getElementById("haltno").textContent =
      `PRECEDENT No ${v.holding_id} · ${v.domain}`;
    document.getElementById("haltsays").textContent = v.says;
    document.getElementById("haltwhy").textContent = v.reason || "";
    const nx = document.getElementById("haltnext");
    nx.textContent = v.next ? "do this next: " + v.next : "";
    nx.style.display = v.next ? "" : "none";
    document.getElementById("halt").classList.add("on");
    clerkState("halt");
    setStatus("halt", "halted");
  } else {
    document.getElementById("halt").classList.remove("on");
    clerkState(skipped ? "skip" : "reading");
    setStatus("live", skipped ? "a rule could not be evaluated" : "reading");
  }

  renderSeats(ev, seats, halted.length);
}

function renderSeats(ev, seats, haltCount){
  const when = new Date((ev.at || 0) * 1000).toLocaleTimeString();
  const tally = {};
  seats.forEach(s => tally[s.verdict] = (tally[s.verdict] || 0) + 1);
  document.getElementById("ledgerhead").textContent = haltCount
    ? `${haltCount} rule${haltCount > 1 ? "s" : ""} stopped this change.`
    : "Nothing objects.";
  document.getElementById("ledgerhint").textContent =
    `${when} · ${seats.length} rules looked · ` +
    ["halt", "note", "skip", "clear"].filter(v => tally[v])
      .map(v => `${tally[v]} ${v}`).join(" · ");

  const order = { halt: 0, note: 1, skip: 2, clear: 3 };
  seats.sort((a, b) => order[a.verdict] - order[b.verdict] || a.holding_id - b.holding_id);
  document.getElementById("seats").innerHTML = seats.map(s => `
    <div class="seat v-${s.verdict}">
      <i></i>
      <div class="who">${s.says}
        ${s.reason ? `<div class="why">${s.reason}</div>` : ""}</div>
      <span class="dom">${s.domain}</span>
    </div>`).join("");
}

// ---- boot --------------------------------------------------------------
Promise.all([
  fetch("sprites/office.json").then(r => r.json()),
  fetch("sprites/clerk.json").then(r => r.json()),
]).then(([office, clerk]) => {
  OFFICE = office; CLERK = { meta: clerk };
  const stage = document.getElementById("stage");
  stage.style.width = ROOM.w * PX + "px";
  stage.style.height = ROOM.h * PX + "px";
  for (const spec of LAYOUT) place("sprites/office.png", office, spec, stage);
  mountClerk(clerk, stage);
  document.getElementById("sprite-papers").style.display = "none";
  clerkState("dormant");
  connect();
}).catch(() => offline());
</script>
